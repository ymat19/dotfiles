onboarding = false

[keys]
prefix = "ctrl+f"
# 既定 goto(prefix+g) を prefix+f へ移し、prefix+g を lazygit に空ける
goto = "prefix+f"
# サイドバーの上下ワークスペースへ移動（prefix+shift+k=上, prefix+shift+j=下）
# 小文字 prefix+j/k は既定で focus_pane_down/up に割当済みのため shift 付きにする
previous_workspace = "prefix+shift+k"
next_workspace = "prefix+shift+j"

[[keys.command]]
key = "prefix+g"
type = "pane"
command = "zsh -c 'source ~/.zshrc && lazygit'"
description = "lazygit"

[[keys.command]]
key = "prefix+d"
type = "pane"
command = "zsh -c 'source ~/.zshrc && lazydocker'"
description = "lazydocker"

[[keys.command]]
key = "prefix+shift+c"
type = "pane"
command = "zsh -c 'source ~/.zshrc && hwt'"
description = "ghq repo を fzf 選択して worktree+ワークスペース作成"

# ペイン移動は組み込みアクションに無いため CLI を呼ぶ
[[keys.command]]
key = "prefix+o"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane move \"$HERDR_ACTIVE_PANE_ID\" --new-workspace --focus"
description = "カレントペインを新しいワークスペースへ切り出す"

[theme]
name = "tokyo-night"

[advanced]
scrollback_limit_bytes = 20971520

# 同一 repo の複数セッションを見分けるため、Claude Code が自動生成する作業タイトルを表示する
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace"],
  [{ token = "terminal_title_stripped", dim = false, fg = "#a9b1d6" }],
]
