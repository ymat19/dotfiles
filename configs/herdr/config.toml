onboarding = false

[keys]
prefix = "ctrl+f"
# 既定 goto(prefix+g) を prefix+f へ移し、prefix+g を lazygit に空ける
goto = "prefix+f"

[[keys.command]]
key = "prefix+g"
type = "pane"
command = "zsh -c 'source ~/.zshrc && lazygit'"
description = "lazygit"

[[keys.command]]
key = "prefix+d"
type = "pane"
command = "zsh -c 'source ~/.zshrc && lazydocker'"
description = "lazydocker"

[[keys.command]]
key = "prefix+shift+c"
type = "pane"
command = "zsh -c 'source ~/.zshrc && hwt'"
description = "ghq repo を fzf 選択して worktree+ワークスペース作成"

# ペイン移動は組み込みアクションに無いため CLI を呼ぶ
[[keys.command]]
key = "prefix+o"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane move \"$HERDR_ACTIVE_PANE_ID\" --new-workspace --focus"
description = "カレントペインを新しいワークスペースへ切り出す"

# カレントワークスペースをサイドバー一覧内で下/上へ移動する。popup が開いている間は C-j/C-k (j/k) の連打で続けて移動できる
[[keys.command]]
key = "prefix+ctrl+j"
type = "popup"
command = "herdr-workspace-move reorder down"
description = "カレントワークスペースを一覧の下へ移動"
width = 40
height = 3

[[keys.command]]
key = "prefix+ctrl+k"
type = "popup"
command = "herdr-workspace-move reorder up"
description = "カレントワークスペースを一覧の上へ移動"
width = 40
height = 3

# サイドバーの上下ワークスペースへ移動。続けて J/K (j/k) を連打すると prefix なしで移動し続ける
# （workspace-nav plugin の popup が開いている 2 秒間）。組み込みの previous/next_workspace は連打できないため置き換える
# 小文字 prefix+j/k は既定で focus_pane_down/up に割当済みのため shift 付きにする
[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = "herdr-workspace-move focus down"
description = "下のワークスペースへ移動"

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = "herdr-workspace-move focus up"
description = "上のワークスペースへ移動"

[theme]
name = "tokyo-night"

[advanced]
scrollback_limit_bytes = 20971520

# 同一 repo の複数セッションを見分けるため、作業内容の要約を表示する。
# Claude Code の端末タイトルは初回プロンプトから作られ更新されず、「Issue 219」のように
# 中身が分からないことがあるため、hook 経由で Claude が書く $task を使う（modules/ai-agent.nix）
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace"],
  [{ token = "terminal_title_stripped", dim = false, fg = "#a9b1d6" }],
]

# $task を書くのは Claude Code の hook だけなので、他のエージェントは端末タイトルのまま
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace"],
  [{ token = "$task", dim = false, fg = "#a9b1d6" }],
]
