onboarding = false

[keys]
prefix = "ctrl+f"
# 既定 goto(prefix+g) を prefix+f へ移し、prefix+g を lazygit に空ける
goto = "prefix+f"

[[keys.command]]
key = "prefix+g"
type = "pane"
command = "zsh -c 'source ~/.zshrc && lazygit'"
description = "lazygit"

[[keys.command]]
key = "prefix+d"
type = "pane"
command = "zsh -c 'source ~/.zshrc && lazydocker'"
description = "lazydocker"

[theme]
name = "tokyo-night"

[advanced]
scrollback_limit_bytes = 20971520
