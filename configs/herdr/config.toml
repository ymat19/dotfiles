onboarding = false

[keys]
prefix = "ctrl+f"
# 既定 goto(prefix+g) を prefix+f へ移し、prefix+g を lazygit に空ける
goto = "prefix+f"
# 既定の close_tab(prefix+X) を外し、サーバー停止に使う
close_tab = []
# agents 一覧の上下の agent へ移動する。prefix 付きだと連打のたびに prefix を押し直すことになり、
# popup で連打を受け付けると popup の開き直しの隙間に打ったキーがペインへ漏れるため、prefix なしにする。
# shift なしの ctrl+j は ctrl+enter と同じ LF で届き、アプリの改行操作と衝突するため shift 付きにする。
# Windows Terminal は ctrl+shift+j/k を ctrl+j/k と同じコードで送り、ctrl+shift+k は既定で画面消去に
# 割り当てているため、Windows Terminal の settings.json で sendInput により kitty 形式の
# "\u001b[106;6u" / "\u001b[107;6u" を送らせている（このリポジトリでは管理していない）
next_agent = "ctrl+shift+j"
previous_agent = "ctrl+shift+k"

[[keys.command]]
key = "prefix+g"
type = "pane"
command = "zsh -c 'source ~/.zshrc && lazygit'"
description = "lazygit"

[[keys.command]]
key = "prefix+d"
type = "pane"
command = "zsh -c 'source ~/.zshrc && lazydocker'"
description = "lazydocker"

[[keys.command]]
key = "prefix+shift+c"
type = "pane"
command = "zsh -c 'source ~/.zshrc && hwt'"
description = "ghq repo を fzf 選択して worktree+ワークスペース作成"

# ペイン移動は組み込みアクションに無いため CLI を呼ぶ
[[keys.command]]
key = "prefix+o"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane move \"$HERDR_ACTIVE_PANE_ID\" --new-workspace --focus"
description = "カレントペインを新しいワークスペースへ切り出す"

# サーバー停止は組み込みアクションに無いため CLI を呼ぶ（detach の prefix+q はサーバーを残す）
[[keys.command]]
key = "prefix+shift+x"
type = "shell"
command = "\"$HERDR_BIN_PATH\" server stop"
description = "herdr サーバーを停止（全ペインのプロセスが終了する）"

# カレント agent を agents 一覧の上下へ動かす。prefix なしにする理由は next_agent と同じ
[[keys.command]]
key = "ctrl+down"
type = "shell"
command = "herdr-agent-move down"
description = "カレント agent を agents 一覧の下へ移動"

[[keys.command]]
key = "ctrl+up"
type = "shell"
command = "herdr-agent-move up"
description = "カレント agent を agents 一覧の上へ移動"

[theme]
name = "tokyo-night"

[ui.toast]
delivery = "system"

[experimental]
# 画面内容をディスクに残すので既定では OFF。再起動後に Claude 以外のペインの画面も戻すため有効化する
pane_history = true
# 公式には macOS の IME 向け。Claude Code 等の TUI で変換候補窓がカーソルに付いてこない問題への対処
reveal_hidden_cursor_for_cjk_ime = true

[advanced]
scrollback_limit_bytes = 20971520

# 同一 repo の複数セッションを見分けるため、作業内容の要約を表示する。
# Claude Code の端末タイトルは初回プロンプトから作られ更新されず、「Issue 219」のように
# 中身が分からないことがあるため、hook 経由で Claude が書く $task1..$task3 を使う（modules/ai-agent.nix）
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace"],
  [{ token = "terminal_title_stripped", dim = false, fg = "#a9b1d6" }],
]

# $task1..$task3 を書くのは Claude Code の hook だけなので、他のエージェントは端末タイトルのまま
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace"],
  [{ token = "$task1", dim = false, fg = "#a9b1d6" }],
  [{ token = "$task2", dim = false, fg = "#a9b1d6" }],
  [{ token = "$task3", dim = false, fg = "#a9b1d6" }],
]
